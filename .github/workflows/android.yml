name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fetch and Stage Native Engine Binaries (Aether & Tun2Socks)
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64

          echo "=== Fetching Aether Core v1.9.0 ==="
          curl -sSL "https://github.com/CluvexStudio/Aether/releases/download/v1.9.0/aether-android-arm64.tar.gz" | tar -xz -C android/app/src/main/jniLibs/arm64-v8a/
          mv android/app/src/main/jniLibs/arm64-v8a/aether android/app/src/main/jniLibs/arm64-v8a/libaether.so
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libaether.so

          curl -sSL "https://github.com/CluvexStudio/Aether/releases/download/v1.9.0/aether-android-armv7.tar.gz" | tar -xz -C android/app/src/main/jniLibs/armeabi-v7a/
          mv android/app/src/main/jniLibs/armeabi-v7a/aether android/app/src/main/jniLibs/armeabi-v7a/libaether.so
          chmod +x android/app/src/main/jniLibs/armeabi-v7a/libaether.so

          curl -sSL "https://github.com/CluvexStudio/Aether/releases/download/v1.9.0/aether-android-x86_64.tar.gz" | tar -xz -C android/app/src/main/jniLibs/x86_64/
          mv android/app/src/main/jniLibs/x86_64/aether android/app/src/main/jniLibs/x86_64/libaether.so
          chmod +x android/app/src/main/jniLibs/x86_64/libaether.so

          echo "=== Fetching In-Process TProxy Engine (libhev-socks5-tunnel.so) ==="
          curl -sSL "https://github.com/heiher/sockstun/releases/download/8.0/hev.sockstun-8.0-release.apk" -o /tmp/sockstun.apk
          unzip -p /tmp/sockstun.apk lib/arm64-v8a/libhev-socks5-tunnel.so > android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so

          unzip -p /tmp/sockstun.apk lib/armeabi-v7a/libhev-socks5-tunnel.so > android/app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so
          chmod +x android/app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so

          unzip -p /tmp/sockstun.apk lib/x86_64/libhev-socks5-tunnel.so > android/app/src/main/jniLibs/x86_64/libhev-socks5-tunnel.so
          chmod +x android/app/src/main/jniLibs/x86_64/libhev-socks5-tunnel.so

          echo "=== Staged JNI Libraries ==="
          ls -lh android/app/src/main/jniLibs/*

      - name: Build Native Android APK
        working-directory: android
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect Output APK
        run: |
          mkdir -p release-apks
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp -v {} release-apks/aether-android.apk \;
          echo "=== Collected APK ==="
          ls -lh release-apks/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Android-APK
          path: release-apks/*.apk
          retention-days: 30

[package]
name = "aether-desktop"
version = "0.1.0"
description = "Production-quality Windows desktop VPN and network routing manager"
authors = ["Aether Team"]
edition = "2021"

[lib]
name = "aether_desktop_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.2.4", features = ["tray-icon"] }
tauri-plugin-opener = "2.2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0"
uuid = { version = "1.13", features = ["v4", "serde"] }
directories = "6.0"
regex = "1.11"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["socks", "rustls-tls"] }

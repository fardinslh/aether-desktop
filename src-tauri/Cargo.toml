[package]
name = "aether-desktop"
version = "0.1.0"
description = "Production-quality Windows desktop VPN and network routing manager"
authors = ["Aether Team"]
edition = "2021"

[lib]
name = "aether_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.2.4", features = ["tray-icon"] }
tauri-plugin-opener = "2.2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0"
uuid = { version = "1.13", features = ["v4", "serde"] }
directories = "6.0"
regex = "1.11"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["socks", "rustls-tls", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Storage_FileSystem"
] }